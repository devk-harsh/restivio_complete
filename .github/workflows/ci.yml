name: Restivio local verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            AuthService/package-lock.json
            HotelService/package-lock.json
            BookingService/package-lock.json
            NotificationService/package-lock.json
            Frontend/package-lock.json
      - run: npm ci
      - run: npm run install:services
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm ci --prefix Frontend
      - run: npm run build --prefix Frontend
      - run: npm test --prefix Frontend
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: npm run test:integration
        env:
          TEST_CHAOS: "true"
      - name: Capture logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down
